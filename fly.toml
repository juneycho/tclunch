# Fly.io 배포 설정 (도쿄 리전: 한국에서 빠름)
app = "tc-lunch"
primary_region = "nrt"

[build]

[env]
  NODE_ENV = "production"
  DB_PATH = "/data/tc-lunch.db"

[mounts]
  source = "tc_lunch_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # 알림 스케줄러가 돌아야 하므로 서버를 재우지 않는다
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
